<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Revery">
  <title>Revery</title>
  "manifest.webmanifest"
  "style.css"
</head>
<body>
<div class="app" id="app">
  <header class="topbar"><button class="icon-btn" id="menuBtn" aria-label="打开侧边栏">☰</button><div class="brand" id="brand">Revery</div><button class="icon-btn" id="addBtn" aria-label="添加角色">＋</button></header>
  <main>
    <section class="profile">
      <div class="identity"><div class="avatar"><img class="avatar-inner" id="profileAvatar" alt="头像"></div><div class="stats"><div><b id="statRoles">3</b><span>角色</span></div><div><b id="statChats">12</b><span>对话</span></div><div><b id="statFiles">0</b><span>文件</span></div></div></div>
      <div class="bio"><strong id="profileName">Ongengia ♡</strong><p id="profileBio">link to your executive character</p><small id="profileLocation">📍 Your private universe</small></div>
      <div class="profile-actions"><button class="soft-btn" id="editProfileBtn">编辑主页</button><button class="soft-btn" id="shareBtn">分享主页</button><button class="soft-btn" id="moreBtn">⌄</button></div>
    </section>
    <section class="stories" id="stories"></section>
    <div class="section-head"><h2>聊天</h2><button id="manageBtn">管理角色</button></div>
    <section class="chat-list" id="chatList"></section>
  </main>
  <nav class="bottom-nav"><button class="nav-btn active"><b>⌂</b>主页</button><button class="nav-btn"><b>⌕</b>发现</button><button class="nav-btn" id="navAdd"><b>⊕</b>添加</button><button class="nav-btn"><b>▧</b>文件</button><button class="nav-btn"><b>○</b>我的</button></nav>
</div>
<div class="drawer" id="drawer"><div class="shade" id="shade"></div><aside class="drawer-panel"><div class="drawer-title"><h2>控制中心</h2><button class="icon-btn" id="closeDrawer">×</button></div><div class="menu-group"><small>Revery</small><button class="menu-item" id="themeBtn"><i>☀</i><span>切换日间版本</span><em>›</em></button><button class="menu-item" id="installBtn"><i>⇩</i><span>安装到桌面</span><em>›</em></button></div><div class="menu-group"><small>连接与模型</small><button class="menu-item" data-open="api"><i>◈</i><span>API 与模型</span><em>›</em></button><button class="menu-item"><i>⌁</i><span>连接测试</span><em>›</em></button></div><div class="menu-group"><small>角色与聊天</small><button class="menu-item" data-open="character"><i>＋</i><span>新建角色卡</span><em>›</em></button><button class="menu-item"><i>⇩</i><span>导入角色卡</span><em>›</em></button><button class="menu-item"><i>☷</i><span>对话与记忆</span><em>›</em></button></div><div class="menu-group"><small>个性化</small><button class="menu-item" data-open="profile"><i>✦</i><span>编辑主页</span><em>›</em></button><button class="menu-item"><i>◐</i><span>主题与聊天气泡</span><em>›</em></button></div><div class="menu-group"><small>数据</small><button class="menu-item" id="exportBtn"><i>⇧</i><span>导出本地数据</span><em>›</em></button><button class="menu-item" id="clearBtn"><i>⌫</i><span>清除演示数据</span><em>›</em></button></div></aside></div>
<section class="page" id="chatPage"><header class="chat-head"><button class="icon-btn" id="backBtn">←</button><img id="chatAvatar"><div class="who"><strong id="chatName"></strong><small>在线</small></div><button class="icon-btn" id="chatMenuBtn">☰</button></header><div class="messages" id="messages"></div><form class="composer" id="composer"><button type="button">＋</button><input id="messageInput" placeholder="发消息……" autocomplete="off"><button class="send" type="submit">↑</button></form></section>
<div class="modal" id="apiModal"><div class="sheet"><h2>API 与模型</h2><div class="field"><label>配置名称</label><input id="apiName" placeholder="例如：默认中转站"></div><div class="field"><label>Base URL</label><input id="apiBase" placeholder="https://example.com/v1"></div><div class="field"><label>API Key</label><input id="apiKey" type="password" placeholder="sk-..."></div><div class="field"><label>模型名称</label><input id="apiModel" placeholder="例如 gpt-5"></div><p class="note">当前原型仅把配置保存在本机浏览器 localStorage。正式上线时应由 VPS 保存服务端密钥，浏览器只持有登录令牌。</p><button class="primary" id="saveApi">保存配置</button><button class="secondary close-modal">取消</button></div></div>
<div class="modal" id="profileModal"><div class="sheet"><h2>编辑主页</h2><div class="field"><label>主页标题</label><input id="editBrand"></div><div class="field"><label>昵称</label><input id="editName"></div><div class="field"><label>个性签名</label><textarea id="editBio"></textarea></div><div class="field"><label>位置或状态</label><input id="editLocation"></div><div class="field"><label>头像图片网址</label><input id="editAvatar"></div><div class="field"><label>或从本地上传头像</label><input id="editAvatarFile" type="file" accept="image/*"></div><button class="primary" id="saveProfile">保存主页</button><button class="secondary close-modal">取消</button></div></div>
<div class="modal" id="characterModal"><div class="sheet"><h2>新建角色卡</h2><div class="field"><label>角色名称</label><input id="charName" placeholder="角色名称"></div><div class="field"><label>头像图片网址</label><input id="charAvatar" placeholder="可留空"></div><div class="field"><label>或从本地上传头像</label><input id="charAvatarFile" type="file" accept="image/*"></div><div class="field"><label>开场白</label><textarea id="charGreeting" placeholder="角色第一次出现时说的话"></textarea></div><div class="field"><label>角色设定</label><textarea id="charPrompt" placeholder="人设、关系、语言风格……"></textarea></div><button class="primary" id="saveCharacter">添加到聊天列表</button><button class="secondary close-modal">取消</button></div></div>
<div class="toast" id="toast"></div>
"app.js"script>
</body>
</html>
