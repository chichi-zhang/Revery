<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>角色主页</title>
  <style>
    :root{--bg:#09090b;--panel:#111114;--panel2:#18181c;--text:#f8f8fa;--muted:#9c9ca6;--line:#29292f;--accent:#8f72ff;--accent2:#e66ca6;--danger:#ff5c71;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif}
    button,input,textarea,select{font:inherit;color:inherit}
    button{border:0;cursor:pointer}
    .app{min-height:100dvh;max-width:520px;margin:auto;background:var(--bg);position:relative;overflow-x:hidden}
    .topbar{position:sticky;top:0;z-index:20;height:58px;padding:calc(var(--safe-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;background:rgba(9,9,11,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.04)}
  </style>
</head>
<body>
</body>
</html>
