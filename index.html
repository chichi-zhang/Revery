<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6fb" id="themeColorMeta">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6fb">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Revery">
  <title>Revery</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="https://imgbed.heliar.top/i/wbD4SRfGIt32J-3S_Camera_XHS_1790171956869_1790325183635edit.jpg">
  <link rel="icon" href="https://imgbed.heliar.top/i/wbD4SRfGIt32J-3S_Camera_XHS_1790171956869_1790325183635edit.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="splash-screen" id="splashScreen"><div class="splash-logo">Revery</div></div>
<div class="app" id="app">
  <header class="topbar"><button class="icon-btn" id="menuBtn" aria-label="打开侧边栏">☰</button><div class="brand" id="brand">Revery</div><button class="icon-btn" id="addBtn" aria-label="添加角色">＋</button></header>
  <main>
    <section class="profile">
      <div class="identity"><div class="avatar"><img class="avatar-inner" id="profileAvatar" alt="头像"></div><div class="stats"><div><b id="statRoles">3</b><span>角色</span></div><div><b id="statChats">12</b><span>对话</span></div><div><b id="statFiles">0</b><span>文件</span></div></div></div>
      <div class="bio"><strong id="profileName">Ongengia ♡</strong><p id="profileBio">link to your executive character</p><small id="profileLocation">📍 Your private universe</small></div>
      <div class="profile-actions"><button class="soft-btn" id="editProfileBtn">编辑主页</button><button class="soft-btn" id="shareBtn">分享主页</button><button class="soft-btn" id="moreBtn">⌄</button></div>
    </section>
    <section class="stories" id="stories"></section>
    <div class="section-head"><h2>聊天</h2><button id="manageBtn">管理角色</button></div>
    <section class="chat-list" id="chatList"></section>
  </main>
  <nav class="bottom-nav">
  <button class="nav-btn active" data-tab="home"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="nav-text">主页</span></button>
  <button class="nav-btn" data-tab="explore"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span><span class="nav-text">发现</span></button>
  <button class="nav-btn" data-tab="memory"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span><span class="nav-text">记忆</span></button>
  <button class="nav-btn" data-tab="terminal"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></span><span class="nav-text">终端</span></button>
  <button class="nav-btn" data-tab="tools"><span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span><span class="nav-text">工具箱</span></button>
</nav>
</div>
<div class="drawer" id="drawer"><div class="shade" id="shade"></div><aside class="drawer-panel"><div class="drawer-title"><h2>控制中心</h2><button class="icon-btn" id="closeDrawer">×</button></div><div class="menu-group"><button class="menu-item" id="themeBtn"><i>☀</i><span>切换日间版本</span><em>›</em></button><button class="menu-item" id="installBtn"><i>⇩</i><span>安装到桌面</span><em>›</em></button></div><div class="menu-group"><small>连接与模型</small><button class="menu-item" data-open="api"><i>◈</i><span>API 与模型</span><em>›</em></button><button class="menu-item"><i>⌁</i><span>连接测试</span><em>›</em></button></div><div class="menu-group"><small>角色与聊天</small><button class="menu-item" data-open="character"><i>＋</i><span>新建角色卡</span><em>›</em></button><button class="menu-item"><i>⇩</i><span>导入角色卡</span><em>›</em></button><button class="menu-item"><i>☷</i><span>对话与记忆</span><em>›</em></button></div><div class="menu-group"><small>个性化</small><button class="menu-item" data-open="profile"><i>✦</i><span>编辑主页</span><em>›</em></button><button class="menu-item"><i>◐</i><span>主题与聊天气泡</span><em>›</em></button></div><div class="menu-group"><small>数据</small><button class="menu-item" id="exportBtn"><i>⇧</i><span>导出本地数据</span><em>›</em></button><button class="menu-item" id="clearBtn"><i>⌫</i><span>清除演示数据</span><em>›</em></button></div></aside></div>
<section class="page Revery-chat-page pudding-online-chat" id="chatPage">
  <style id="ReveryCustomChatStyle"></style>
  <header class="chat-head Revery-chat-topbar cv-header" id="chatTopbar">
    <button class="icon-btn Revery-chat-back-btn cv-header-btn pudding-online-topbar-back-button" id="backBtn" type="button">←</button>
    <img class="Revery-chat-avatar cv-header-avatar" id="chatAvatar" alt="avatar">
    <div class="who Revery-chat-who cv-title-wrap">
      <strong class="Revery-chat-name cv-title pudding-online-topbar-title" id="chatName"></strong>
      <small class="Revery-chat-status pudding-online-topbar-status-text" id="chatStatus">在线</small>
    </div>
    <div class="Revery-chat-topbar-actions cv-header-actions">
      <button class="icon-btn Revery-chat-call-btn cv-header-btn pudding-online-topbar-call-btn" id="chatCallBtn" type="button" title="语音通话">📞</button>
      <button class="icon-btn Revery-chat-video-btn cv-header-btn pudding-online-topbar-video-btn" id="chatVideoBtn" type="button" title="视频通话">📹</button>
      <button class="icon-btn Revery-chat-settings-btn cv-header-btn pudding-online-topbar-settings-button" id="chatMenuBtn" type="button" title="聊天设置">☰</button>
    </div>
  </header>

  <div class="messages Revery-chat-messages cv-messages" id="messages"></div>

  <!-- 点击加号弹出的多功能菜单 -->
  <div class="Revery-plus-panel cv-plus-panel" id="plusPanel">
    <button class="Revery-plus-item cv-plus-item" type="button" data-action="image">
      <div class="Revery-plus-icon cv-plus-item-icon">🖼️</div>
      <span class="Revery-plus-label cv-plus-item-label">图片</span>
    </button>
    <button class="Revery-plus-item cv-plus-item" type="button" data-action="video">
      <div class="Revery-plus-icon cv-plus-item-icon">🎥</div>
      <span class="Revery-plus-label cv-plus-item-label">视频</span>
    </button>
    <button class="Revery-plus-item cv-plus-item" type="button" data-action="sticker">
      <div class="Revery-plus-icon cv-plus-item-icon">🐱</div>
      <span class="Revery-plus-label cv-plus-item-label">表情包</span>
    </button>
  </div>

  <div class="Revery-chat-footer cv-footer-panel">
    <form class="composer Revery-chat-composer cv-footer pudding-online-input-row" id="composer">
      <div class="Revery-chat-func-wrap">
        <button class="Revery-chat-plus-btn cv-func-btn" id="plusBtn" type="button">＋</button>
      </div>
      <div class="Revery-chat-input-shell cv-input-shell">
        <input class="Revery-chat-input cv-input" id="messageInput" placeholder="发消息……" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="Revery-chat-action-wrap cv-action-wrap">
        <button class="send Revery-chat-send-btn cv-send-btn" id="sendBtn" type="submit" title="发送消息">↑</button>
        <button class="send Revery-chat-api-btn cv-api-btn" id="apiReplyBtn" type="button" title="请求API回复">✨</button>
      </div>
    </form>
  </div>
</section>
<div class="modal" id="apiModal"><div class="sheet"><h2>API 与模型</h2><div class="field"><label>配置名称</label><input id="apiName" placeholder="例如：默认中转站"></div><div class="field"><label>Base URL</label><input id="apiBase" placeholder="https://example.com/v1"></div><div class="field"><label>API Key</label><input id="apiKey" type="password" placeholder="sk-..."></div><div class="field"><label>模型名称</label><input id="apiModel" placeholder="例如 gpt-5"></div><p class="note">当前原型仅把配置保存在本机浏览器 localStorage。正式上线时应由 VPS 保存服务端密钥，浏览器只持有登录令牌。</p><button class="primary" id="saveApi">保存配置</button><button class="secondary close-modal">取消</button></div></div>
<div class="modal" id="profileModal"><div class="sheet"><h2>编辑主页</h2><div class="field"><label>主页标题</label><input id="editBrand"></div><div class="field"><label>昵称</label><input id="editName"></div><div class="field"><label>个性签名</label><textarea id="editBio"></textarea></div><div class="field"><label>位置或状态</label><input id="editLocation"></div><div class="field"><label>头像图片网址</label><input id="editAvatar"></div><div class="field"><label>或从本地上传头像</label><input id="editAvatarFile" type="file" accept="image/*"></div><button class="primary" id="saveProfile">保存主页</button><button class="secondary close-modal">取消</button></div></div>
<div class="modal" id="characterModal"><div class="sheet"><h2>新建角色卡</h2><div class="field"><label>角色名称</label><input id="charName" placeholder="角色名称"></div><div class="field"><label>头像图片网址</label><input id="charAvatar" placeholder="可留空"></div><div class="field"><label>或从本地上传头像</label><input id="charAvatarFile" type="file" accept="image/*"></div><div class="field"><label>开场白</label><textarea id="charGreeting" placeholder="角色第一次出现时说的话"></textarea></div><div class="field"><label>角色设定</label><textarea id="charPrompt" placeholder="人设、关系、语言风格……"></textarea></div><button class="primary" id="saveCharacter">添加到聊天列表</button><button class="secondary close-modal">取消</button></div></div>

<div class="modal Revery-chat-theme-modal" id="chatThemeModal">
  <div class="sheet Revery-chat-theme-sheet">
    <h2>聊天独立美化与设置</h2>
    <div class="field">
      <label>角色头像 URL</label>
      <input id="chatCustomAvatar" placeholder="https://... 留空使用默认头像">
    </div>
    <div class="field">
      <label>聊天壁纸背景 URL</label>
      <input id="chatCustomBg" placeholder="https://... 留空使用默认背景">
    </div>
    <div class="field">
      <label>独立注入 CSS (仅当前聊天生效)</label>
      <textarea id="chatCustomCss" placeholder="例如:&#10;.Revery-chat-topbar { background: transparent !important; }&#10;.bubble.them { background: #fff !important; color: #000; border-radius: 20px 20px 20px 4px; }&#10;.bubble.me { background: #ff758c !important; }"></textarea>
    </div>
    <button class="primary" id="saveChatTheme">保存当前聊天美化</button>
    <button class="secondary close-modal">取消</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
